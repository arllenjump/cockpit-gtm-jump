services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cockpit
      POSTGRES_PASSWORD: cockpit
      POSTGRES_DB: cockpit
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "cockpit"]
      interval: 2s
      retries: 15

  api:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    working_dir: /app
    command: sh -c "uv sync && uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://cockpit:cockpit@db:5432/cockpit
      APP_URL: http://localhost:5173
    volumes: ["./api:/app", "/app/.venv"]
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    environment:
      API_URL: http://api:8000
    volumes: ["./web:/app", "/app/node_modules"]
    ports: ["5173:5173"]
    depends_on: [api]
